<svg width="56" height="64" viewBox="0 0 56 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Palm base -->
  <rect x="5" y="32" width="38" height="28" rx="7" fill="#F5B200"/>
  <!-- Pinky (leftmost, shortest) -->
  <rect x="5" y="16" width="8" height="22" rx="4" fill="#F5B200"/>
  <!-- Ring finger -->
  <rect x="14.5" y="11" width="8" height="27" rx="4" fill="#F5B200"/>
  <!-- Middle finger (tallest) -->
  <rect x="24" y="8" width="8" height="30" rx="4" fill="#F5B200"/>
  <!-- Index finger -->
  <rect x="33.5" y="11" width="8" height="27" rx="4" fill="#F5B200"/>
  <!-- Thumb (horizontal, right side) -->
  <rect x="37" y="26" width="16" height="10" rx="5" fill="#F5B200"/>
</svg>
