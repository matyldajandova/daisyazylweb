<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>Daisy Azyl – Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
  </head>
  <body>
    <!-- Decap CMS will mount into this div -->
    <div id="nc-root"></div>
    <script src="/admin/optimize-uploads.js"></script>
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script>
      CMS.registerEventListener({
        name: "preSave",
        handler: function (event) {
          var data = event.entry.get("data");
          if (data.get("species") && !data.get("id")) {
            return data.set("id", String(Date.now()));
          }
          return data;
        },
      });
    </script>
  </body>
</html>
