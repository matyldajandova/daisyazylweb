backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "animals"
    label: "Zvířata k adopci"
    label_singular: "Zvíře"
    format: "json"
    editor:
      preview: false
    files:
      - name: "animals-data"
        label: "Seznam zvířat"
        file: "_data/animals.json"
        fields:
          - label: "Zvířata"
            name: "animals"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Jméno", name: "name", widget: "string" }
              - { label: "Druh", name: "species", widget: "string", default: "kočka" }
              - { label: "Věk (text)", name: "ageText", widget: "string", required: false }
              - label: "Štítky"
                name: "tags"
                widget: "list"
                required: false
              - label: "Hlavní obrázek"
                name: "image"
                widget: "image"
              - label: "Stručný popis"
                name: "shortDescription"
                widget: "text"
              - label: "URL detailu"
                name: "detailUrl"
                widget: "string"
                default: "adopce-detail.html"
              - label: "Stav adopce"
                name: "adoptionStatus"
                widget: "select"
                options:
                  - { label: "K adopci", value: "available" }
                  - { label: "Rezervováno", value: "reserved" }
                  - { label: "Adoptováno", value: "adopted" }

