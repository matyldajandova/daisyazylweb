backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

local_backend: true

collections:
  - name: "animals"
    label: "Zvířata k adopci"
    label_singular: "Zvíře"
    format: "json"
    editor:
      preview: false
    files:
      - name: "animals-data"
        label: "Seznam zvířat"
        file: "cms/animals.json"
        fields:
          - label: "Zvířata"
            name: "animals"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
              - label: "Jméno"
                name: "name"
                widget: "string"
              - label: "Druh"
                name: "species"
                widget: "select"
                options:
                  - { label: "Kočka", value: "kočka" }
                  - { label: "Pes", value: "pes" }
                default: "kočka"
              - label: "Věk (text)"
                name: "ageText"
                widget: "string"
                required: false
              - label: "Štítky"
                name: "tags"
                widget: "list"
                required: false
              - label: "Hlavní obrázek"
                name: "image"
                widget: "image"
              - label: "Stručný popis"
                name: "shortDescription"
                widget: "text"
              - label: "Stav adopce"
                name: "adoptionStatus"
                widget: "select"
                options:
                  - { label: "Trvalý svěřenec", value: "permanent" }
                  - { label: "K adopci",        value: "available" }
                  - { label: "Rezervováno",     value: "reserved" }
                  - { label: "Adoptováno",      value: "adopted" }
                default: "available"
              - label: "Evidenční číslo"
                name: "evidenceNumber"
                widget: "string"
                required: false
              - label: "Datum narození"
                name: "birthDate"
                widget: "datetime"
                format: "DD.MM.YYYY"
                date_format: "DD.MM.YYYY"
                time_format: false
                required: false
              - label: "Věková kategorie"
                name: "ageCategory"
                widget: "select"
                options:
                  - { label: "Kotě", value: "Kotě" }
                  - { label: "Mladý", value: "Mladý" }
                  - { label: "Dospělý", value: "Dospělý" }
                  - { label: "Senior", value: "Senior" }
                required: false
              - label: "Pohlaví"
                name: "gender"
                widget: "select"
                options:
                  - { label: "Samička", value: "samička" }
                  - { label: "Sameček", value: "sameček" }
                required: false
              - label: "Plemeno"
                name: "breed"
                widget: "string"
                required: false
              - label: "Zbarvení"
                name: "color"
                widget: "string"
                required: false
              - label: "Opatrovník"
                name: "guardian"
                widget: "string"
                required: false
              - label: "Datum nálezu"
                name: "foundDate"
                widget: "datetime"
                format: "DD.MM.YYYY"
                date_format: "DD.MM.YYYY"
                time_format: false
                required: false
              - label: "Původ příjmu"
                name: "origin"
                widget: "text"
                required: false
              - label: "Vhodné ven"
                name: "suitableOutdoor"
                widget: "boolean"
                required: false
              - label: "Vhodné k dalším kočkám"
                name: "suitableWithCats"
                widget: "boolean"
                required: false
              - label: "Vhodné k psům"
                name: "suitableWithDogs"
                widget: "boolean"
                required: false
              - label: "Vhodné k dětem"
                name: "suitableWithChildren"
                widget: "boolean"
                required: false
              - label: "Vhodné k odrostlejším dětem"
                name: "suitableWithOlderChildren"
                widget: "boolean"
                required: false
              - label: "Test na panleukopenii"
                name: "panleukopeniaTest"
                widget: "select"
                options:
                  - { label: "Negativní", value: "Negativní" }
                  - { label: "Pozitivní", value: "Pozitivní" }
                required: false
              - label: "Test na FeLV"
                name: "felvTest"
                widget: "select"
                options:
                  - { label: "Negativní", value: "Negativní" }
                  - { label: "Pozitivní", value: "Pozitivní" }
                required: false
              - label: "Test na FIV"
                name: "fivTest"
                widget: "select"
                options:
                  - { label: "Negativní", value: "Negativní" }
                  - { label: "Pozitivní", value: "Pozitivní" }
                required: false
              - label: "Kastrovaný"
                name: "neutered"
                widget: "boolean"
                required: false
              - label: "První vakcinace"
                name: "firstVaccination"
                widget: "boolean"
                required: false
              - label: "Druhá vakcinace"
                name: "secondVaccination"
                widget: "boolean"
                required: false
              - label: "Galerie"
                name: "gallery"
                widget: "list"
                required: false
                field:
                  label: "Obrázek"
                  name: "image"
                  widget: "image"

  - name: "partners"
    label: "Partneři"
    label_singular: "Partner"
    format: "json"
    editor:
      preview: false
    files:
      - name: "partners-data"
        label: "Seznam partnerů"
        file: "cms/partners.json"
        fields:
          - label: "Partneři"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "Název"
                name: "name"
                widget: "string"
              - label: "Logo"
                name: "logo"
                widget: "image"
              - label: "URL"
                name: "url"
                widget: "string"
                required: false

