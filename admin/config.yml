backend:
  name: bitbucket
  repo: grenadecastle/daisy-azyl-web   # workspace/repo-name
  branch: main
  auth_type: implicit
  app_id: uej7WfLn9ev5MtZNRJ

media_folder: "images/uploads"
public_folder: "/images/uploads"

local_backend: true

collections:
  - name: "animals"
    label: "Zvířata k adopci"
    label_singular: "Zvíře"
    format: "json"
    editor:
      preview: false
    files:
      - name: "animals-data"
        label: "Seznam zvířat"
        file: "cms/animals.json"
        fields:
          - label: "Zvířata"
            name: "animals"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
              - label: "Jméno"
                name: "name"
                widget: "string"
              - label: "Druh"
                name: "species"
                widget: "string"
                default: "kočka"
              - label: "Věk (text)"
                name: "ageText"
                widget: "string"
                required: false
              - label: "Štítky"
                name: "tags"
                widget: "list"
                required: false
              - label: "Hlavní obrázek"
                name: "image"
                widget: "image"
              - label: "Stručný popis"
                name: "shortDescription"
                widget: "text"
              - label: "Stav adopce"
                name: "adoptionStatus"
                widget: "select"
                options:
                  - label: "K adopci"
                    value: "available"
                  - label: "Rezervováno"
                    value: "reserved"
                  - label: "Adoptováno"
                    value: "adopted"
              - label: "Evidenční číslo"
                name: "evidenceNumber"
                widget: "string"
                required: false
              - label: "Datum narození"
                name: "birthDate"
                widget: "string"
                required: false
              - label: "Věková kategorie"
                name: "ageCategory"
                widget: "string"
                required: false
              - label: "Pohlaví"
                name: "gender"
                widget: "string"
                required: false
              - label: "Plemeno"
                name: "breed"
                widget: "string"
                required: false
              - label: "Zbarvení"
                name: "color"
                widget: "string"
                required: false
              - label: "Opatrovník"
                name: "guardian"
                widget: "string"
                required: false
              - label: "Datum nálezu"
                name: "foundDate"
                widget: "string"
                required: false
              - label: "Původ příjmu"
                name: "origin"
                widget: "text"
                required: false
              - label: "Vhodné ven"
                name: "suitableOutdoor"
                widget: "boolean"
                required: false
              - label: "Vhodné k dalším kočkám"
                name: "suitableWithCats"
                widget: "boolean"
                required: false
              - label: "Vhodné k psům"
                name: "suitableWithDogs"
                widget: "boolean"
                required: false
              - label: "Vhodné k dětem"
                name: "suitableWithChildren"
                widget: "boolean"
                required: false
              - label: "Vhodné k odrostlejším dětem"
                name: "suitableWithOlderChildren"
                widget: "boolean"
                required: false
              - label: "Test na panleukopenii"
                name: "panleukopeniaTest"
                widget: "string"
                required: false
              - label: "Test na FeLV"
                name: "felvTest"
                widget: "string"
                required: false
              - label: "Test na FIV"
                name: "fivTest"
                widget: "string"
                required: false
              - label: "Kastrovaný"
                name: "neutered"
                widget: "boolean"
                required: false
              - label: "První vakcinace"
                name: "firstVaccination"
                widget: "boolean"
                required: false
              - label: "Druhá vakcinace"
                name: "secondVaccination"
                widget: "boolean"
                required: false
              - label: "Galerie"
                name: "gallery"
                widget: "list"
                required: false
                field:
                  label: "Obrázek"
                  name: "image"
                  widget: "image"

